<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing orb accent -->
  <circle cx="1050" cy="180" r="140" fill="#4F46E5" opacity="0.25" filter="blur(60px)" />

  <!-- Content Container -->
  <g transform="translate(100, 110)">
    <!-- Entity Badge -->
    <rect width="360" height="42" rx="21" fill="#312E81" opacity="0.8" />
    <circle cx="22" cy="21" r="7" fill="#38BDF8" />
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E0E7FF" letter-spacing="1">
      PALANI, TAMIL NADU, INDIA
    </text>

    <!-- Main Name & Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      SURIYADEVAN S
    </text>

    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#accentGrad)">
      SEO &amp; Digital Marketing Specialist
    </text>

    <!-- Value Statement -->
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      Helping businesses rank #1 on Google, capture local map searches,
    </text>
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      and scale customer acquisition through data-driven SEO &amp; Meta Ads.
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="165" height="44" rx="10" fill="#1E293B" stroke="#334155" />
      <text x="82" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F1F5F9">Local SEO</text>

      <rect x="180" y="0" width="190" height="44" rx="10" fill="#1E293B" stroke="#334155" />
      <text x="275" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F1F5F9">Technical SEO</text>

      <rect x="385" y="0" width="180" height="44" rx="10" fill="#1E293B" stroke="#334155" />
      <text x="475" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F1F5F9">Meta Ads</text>

      <rect x="580" y="0" width="220" height="44" rx="10" fill="#1E293B" stroke="#334155" />
      <text x="690" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F1F5F9">Google Maps 3-Pack</text>
    </g>
  </g>
</svg>
